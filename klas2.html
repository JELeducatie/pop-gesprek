<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mijn POP-gesprek</title>
<style>
:root{--paars:#83276C;--paars-l:#F5EAF2;--geel:#FEC817;--bg:#f7f3f6;--card:#fff;--tekst:#1f1a1e;--zacht:#6e5c69;--rand:#e4d8e1}
*{box-sizing:border-box}
body{margin:0;font-family:"Avenir Next","Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--tekst)}
header{background:var(--geel);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:22px;color:#fff;font-weight:800;text-shadow:0 1px 0 rgba(131,39,108,.25)}
header .versie{background:var(--paars);color:#fff;border-radius:20px;padding:4px 12px;font-size:13px;font-weight:700}
header .voortgang{flex:1 1 200px;max-width:360px;height:10px;background:rgba(255,255,255,.6);border-radius:6px;overflow:hidden;margin-left:auto}
header .voortgang div{height:100%;background:var(--paars);width:0;transition:width .3s}
header .ghost{background:transparent;border:1.5px solid var(--paars);color:var(--paars);padding:8px 13px;font-size:14px}
header .ghost:hover{background:rgba(255,255,255,.45)}
.backupblok{background:var(--paars-l);border-radius:12px;padding:14px 16px;margin:18px 0 0;font-size:15px}
.backupblok p{margin:0 0 10px}
.backupblok .rij{margin-top:0}
.backupblok button.sec{background:#fff;border:1.5px solid var(--paars)}
.layout{display:flex;gap:20px;padding:20px;max-width:1280px;margin:0 auto;align-items:flex-start}
nav#stappen{flex:0 0 250px;background:var(--card);border-radius:14px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);position:sticky;top:12px}
nav#stappen button{display:flex;width:100%;align-items:center;gap:10px;background:transparent;color:var(--tekst);font-weight:600;padding:9px 8px;border-radius:9px;text-align:left;font-size:14.5px}
nav#stappen button:hover{background:var(--paars-l)}
nav#stappen button.actief{background:var(--paars);color:#fff}
nav#stappen .nr{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--paars-l);color:var(--paars)}
nav#stappen button.klaar .nr{background:var(--geel);color:var(--paars)}
nav#stappen button.actief .nr{background:#fff;color:var(--paars)}
section#kaart{flex:1 1 auto;min-width:0;background:var(--card);border-radius:14px;padding:26px 30px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
#kaart h2{margin:0 0 4px;color:var(--paars);font-size:34px;font-weight:800;line-height:1.15}
#kaart .uitleg{color:var(--zacht);margin:4px 0 20px;font-size:15px}
.veld{margin:0 0 16px}
.veld label{display:block;font-weight:700;margin:0 0 6px;font-size:15.5px}
.veld input[type=text],.veld textarea,.veld select{width:100%;padding:11px 13px;border:1.5px solid var(--rand);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--tekst)}
.veld textarea{min-height:76px;resize:vertical}
.veld input:focus,.veld textarea:focus,.veld select:focus{outline:none;border-color:var(--paars);box-shadow:0 0 0 3px var(--paars-l)}
.teller{font-size:12px;color:var(--zacht);text-align:right;margin-left:auto}
.teller.vol{color:var(--paars);font-weight:700}
.onderrij{display:flex;align-items:center;gap:8px;margin-top:4px;min-height:22px}
.tipknop{background:transparent;color:var(--paars);border:1px solid var(--rand);padding:2px 10px;border-radius:12px;font-size:12.5px;font-weight:600;animation:tipin .5s ease}
.tipknop:hover,.tipknop[aria-expanded=true]{background:var(--paars-l);border-color:var(--paars)}
@keyframes tipin{from{opacity:0}to{opacity:1}}
.tipvak{background:#FCF8FB;border:1px solid var(--rand);border-radius:10px;padding:10px 14px;margin-top:6px;font-size:14px;animation:tipin .25s ease}
.tipvak ul{margin:0 0 8px;padding-left:18px}.tipvak li{margin:2px 0}
.tiprij{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px}.tiprij span{color:var(--zacht);font-size:13px}
.starter{background:#fff;color:var(--paars);border:1px dashed var(--paars);padding:4px 10px;border-radius:14px;font-size:13px;font-weight:600}
.tipvak details summary{cursor:pointer;color:var(--paars);font-weight:600;font-size:13px}
.tipvak .zwak{color:#9a7b90;margin:6px 0 2px}.tipvak .sterk{color:#2E6B33;margin:2px 0 0}
.hulplink{background:transparent;color:var(--paars);padding:4px 0;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;margin:-10px 0 14px}
.hulplink.open{text-decoration:none}
.hulpvak{background:#FCF8FB;border:1px solid var(--rand);border-radius:12px;padding:14px 16px;margin:0 0 20px;font-size:14.5px}
.hulpvak p{margin:0 0 8px}.hulpvak .chips button{font-size:13.5px;padding:6px 12px}
.hulpres{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hulpres div{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.hulpres span{font-size:13.5px;color:var(--zacht)}
.hulplijst{margin:0;padding-left:20px}.hulplijst li{margin:2px 0}
.steun{border:0;padding:0;margin:0 0 6px}.steun legend{font-weight:700;font-size:15.5px;padding:0;margin:0 0 8px}
.steun .veld{margin:0 0 10px 18px}.steun .veld label{font-weight:600;font-size:14.5px}.steun textarea{min-height:58px}
.doelrecap{border:1.5px solid var(--paars-l);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:15px}.doelrecap span{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--zacht)}
.veld p.groep{margin:10px 0 6px;font-size:13px;font-weight:700;color:var(--zacht)}.veld p.groep:first-of-type{margin-top:2px}
.veld .max{font-weight:400;color:var(--zacht);font-size:13.5px}
.vsblok{border:1.5px solid var(--rand);border-radius:12px;padding:12px 16px;margin:0 0 12px}
.vsblok h3{margin:0 0 6px;font-size:16px;color:var(--paars)}
.vsgemeen{background:#EEF7EA;border-color:#d5e8cd}.vsprof{background:#EEF5FB;border-color:#d3e3f1}.vsvrij{background:#FDF1EA;border-color:#f1dccd}
.vsvast{margin:0 0 6px;font-size:14.5px}.vsvast::before{content:"✓ ";color:var(--paars);font-weight:700}
.vsgroep{margin:8px 0 4px}.vslabel{margin:0 0 5px;font-size:13.5px;font-weight:700}.vslabel span{font-weight:400;color:var(--zacht)}
.vsnoot{font-size:13px;color:var(--zacht);margin:6px 0 0}.vsuitleg{font-size:14px;margin:0 0 8px}
.vsprofielen,.vsroutes{display:flex;flex-wrap:wrap;gap:8px}
.vsprofielen button,.vsroutes button{background:#fff;border:1.5px solid var(--rand);color:var(--paars);border-radius:10px;padding:8px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.vsprofielen button span{font-weight:400;font-size:12.5px;color:var(--zacht)}
.vsprofielen button.aan,.vsroutes button.aan{background:var(--paars);border-color:var(--paars);color:#fff}.vsprofielen button.aan span{color:#f3dcec}
.chips button:disabled{opacity:.35;cursor:not-allowed}
.vsstatus{background:#FFF6D6;border-radius:10px;padding:10px 14px;font-size:14px;margin:0 0 16px;color:#5a4400}.vsstatus.ok{background:#E6F4E4;color:#2E6B33;font-weight:700}
.vsmatch{margin:4px 0 6px}.vsmatch summary{cursor:pointer;color:var(--paars);font-weight:600;font-size:14.5px}.vsmatch #plek{max-width:560px;margin-top:8px}
#printvorm{display:none}
@media print{body>*:not(#printvorm){display:none!important}#printvorm{display:block}body{background:#fff}
 .pv{font-family:Arial,sans-serif;color:#000;font-size:12pt}.pv h1{font-size:15pt;margin:0 0 10px}
 .pv table{width:100%;border-collapse:collapse;margin:0 0 12px}.pv th,.pv td{border:1px solid #000;padding:7px 9px;text-align:left;vertical-align:top}.pv th{width:30%;background:#eee}
 .pvteken{display:flex;gap:30px;margin-top:40px}.pvteken div{flex:1;border-bottom:1px solid #000;height:70px;position:relative}.pvteken span{position:absolute;bottom:-20px;font-size:10pt}.pvlet{color:#b00}}
.wielstatus{text-align:center;font-size:14px;margin:4px 0 0;color:var(--zacht)}.wielstatus b{color:var(--paars)}.wielstatus.ok{color:#2E6B33;font-weight:700}
.slogan{float:right;width:170px;margin:0 0 10px 20px}@media (max-width:860px){.slogan{width:120px}}
.sterker{color:var(--zacht);font-size:14px}.sterker a{color:var(--paars);cursor:pointer;text-decoration:underline}
.tip{background:#FFF6D6;border-radius:10px;padding:10px 14px;font-size:14.5px;margin:0 0 16px;color:#5a4400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:#fff;border:1.5px solid var(--rand);color:var(--tekst);padding:8px 14px;border-radius:20px;font-weight:600;font-size:14.5px}
.chips button.aan{background:var(--paars);border-color:var(--paars);color:#fff}
.chips button:disabled{opacity:.35;cursor:not-allowed}
button{font:inherit;font-size:15px;padding:10px 18px;border-radius:10px;border:0;cursor:pointer;background:var(--paars);color:#fff;font-weight:700}
button.sec{background:var(--paars-l);color:var(--paars)}
button.geel{background:var(--geel);color:var(--paars)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:18px;border-top:1.5px solid var(--paars-l)}
.balk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.balk .rechts{margin-left:auto}
.seg{display:inline-flex;background:var(--paars-l);border-radius:10px;padding:3px}
.seg button{background:transparent;color:var(--paars);padding:8px 13px;border-radius:8px;font-size:14px}
.seg button.actief{background:var(--paars);color:#fff}
.visbox{max-width:640px;margin:0 auto}
svg.vis{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none}
svg.vis .cel{cursor:pointer}
svg.vis .cel:hover{opacity:.65}
.hint{font-size:14px;color:var(--zacht);text-align:center;margin:8px 0 0}
.twee{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.lijst{list-style:none;padding:0;margin:0 0 20px}
.lijst li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--paars-l);font-size:15.5px}
.lijst .ok{color:#2E7D32;font-weight:800}.lijst .leeg{color:#C46A16;font-weight:800}
.groot{font-size:18px;padding:14px 26px}
#werk{display:none}
.rij{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2a1f27;color:#fff;padding:12px 18px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;font-size:14.5px;max-width:90vw;text-align:center;z-index:30}
#toast.show{opacity:1}
[hidden]{display:none!important}
@media (max-width:860px){header{gap:8px}header h1{font-size:19px}header .voortgang{order:5;flex:1 1 100%;max-width:none;margin:0}header #backupOpslaan{margin-left:auto}header .ghost{font-size:0;padding:8px 10px}header .ghost::first-letter{font-size:16px}.layout{flex-direction:column;padding:12px}nav#stappen{position:static;width:100%;flex:none;display:flex;overflow-x:auto;gap:4px}nav#stappen button{flex:0 0 auto;width:auto}nav#stappen .lbl{display:none}section#kaart{width:100%;padding:20px}.twee{grid-template-columns:1fr}}
</style>
</head>
<body>
<script id="config" type="application/json">{"versie":"klas2"}</script>
<header>
  <h1>Mijn POP-gesprek</h1><span class="versie" id="versieLabel"></span>
  <div class="voortgang"><div id="voortgang"></div></div>
  <button class="ghost" id="backupOpslaan" title="Sla je antwoorden op als bestand">💾 Backup opslaan</button>
  <button class="ghost" id="backupOpenen" title="Ga verder met een opgeslagen backup">📂 Backup openen</button>
  <input type="file" id="backupBestand" accept=".pop,.json,application/json" hidden>
</header>
<div class="layout">
  <nav id="stappen"></nav>
  <section id="kaart"></section>
</div>
<div id="werk">
  <svg class="vis" id="svgVaard" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1300"></svg>
  <svg class="vis" id="svgRoos" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1300"></svg>
  <svg class="vis" id="svgKwadrant" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180"></svg>
  <svg class="vis" id="svgProfiel" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"></svg>
</div>
<div id="toast"></div>

function pt(a,r){const t=a*Math.PI/180;return[CX+r*Math.cos(t),CY-r*Math.sin(t)]}
function sector(a1,a2,rI,rO){
  const[x1,y1]=pt(a1,rO),[x2,y2]=pt(a2,rO),[x3,y3]=pt(a2,rI),[x4,y4]=pt(a1,rI);
  return`M${f(x1)} ${f(y1)}A${rO} ${rO} 0 0 1 ${f(x2)} ${f(y2)}L${f(x3)} ${f(y3)}A${rI} ${rI} 0 0 0 ${f(x4)} ${f(y4)}Z`;
}
function arc(a1,a2,r){const[x1,y1]=pt(a1,r),[x2,y2]=pt(a2,r);return`M${f(x1)} ${f(y1)}A${r} ${r} 0 0 1 ${f(x2)} ${f(y2)}`}
function boog(c,span,r,boven){
  const a1=c+span/2,a2=c-span/2,la=span>180?1:0;
  if(boven){const p=pt(a1,r),q=pt(a2,r);return`M${f(p[0])} ${f(p[1])}A${r} ${r} 0 ${la} 1 ${f(q[0])} ${f(q[1])}`}
  const p=pt(a2,r),q=pt(a1,r);return`M${f(p[0])} ${f(p[1])}A${r} ${r} 0 ${la} 0 ${f(q[0])} ${f(q[1])}`;
}
let pid=0,pfx="a";
function boogTekst(defs,c,span,r,boven,tekst,fs,kleur,font,gewicht){

}
function labelTekst(defs,c,seg,label,maxFs){
  const boven=Math.sin(c*Math.PI/180)>=-0.01;
  const regels=label.split("|").map(s=>s.trim()).filter(Boolean);
  const span=seg*0.94,maxC=Math.max(...regels.map(s=>s.length),1),rB=R+22;
  const fs=Math.min(maxFs,rB*span*Math.PI/180/(maxC*0.56)),lh=fs*1.15;let out="";
  regels.forEach((t,i)=>{
    const r=boven?rB+(regels.length-1-i)*lh:rB+fs*0.78+i*lh;
    out+=boogTekst(defs,c,span,r,boven,t,fs,PAARS,FONT,700);
  });
  return out;
}
function ringNummers(max,bw){

function parseProf(tekst){

    const vakken=r.slice(i+1).split(",").map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)\s*\*\s*(\d+(?:[.,]\d+)?)$/);return m?{v:sleutel(m[1]),w:parseFloat(m[2].replace(",","."))}:{v:sleutel(x),w:1}});
    return{naam,vakken};
  });
}
function wrap(t,n){const w=t.split(" ");const out=[""];w.forEach(x=>{if((out[out.length-1]+" "+x).trim().length>n)out.push(x);else out[out.length-1]=(out[out.length-1]+" "+x).trim()});return out}
function parseKlassen(){
  return cfg.klassen.split("\n").map(r=>r.trim()).filter(r=>r.includes("=")).map(r=>{const i=r.indexOf("=");
    return{naam:r.slice(0,i).trim(),groepen:r.slice(i+1).split("|").map(g=>g.split("+").map(x=>x.trim()).filter(Boolean)).filter(g=>g.length)}});

function regelVoor(key,tekst){const r=VRAAGREGELS[key];if(!r)return null;return(r.weetniet&&RX.weetniet.test(tekst))?r.weetniet:r}
function beoordeel(key,tekst){
  tekst=(tekst||"").trim();const r=regelVoor(key,tekst);
  if(!KW_AAN()||!r||!tekst)return{ok:true,missen:[],regel:r};
  const woorden=tekst.split(/\s+/).filter(w=>/\w/.test(w)).length,missen=[];
  if(VAAG.test(tekst))missen.push(MELD.vaag);
  else if(woorden<r.min)missen.push(MELD.kort);
  r.nodig.forEach(n=>{if(!RX[n].test(tekst))missen.push(MELD[n])});
  return{ok:!missen.length,missen:missen.slice(0,2),regel:r};
}
function kwVeldHtml(key){
  if(!KW_AAN()||!VRAAGREGELS[key])return"";
  return`<button type="button" class="tipknop" data-tipknop="${key}" hidden aria-expanded="false">💡 tip</button>`;
}
function tipVakHtml(key){return KW_AAN()&&VRAAGREGELS[key]?`<div class="tipvak" data-tipvak="${key}" hidden></div>`:""}
function vulTipVak(key){
  const vak=document.querySelector(`[data-tipvak="${key}"]`);if(!vak)return;
  const b=beoordeel(key,st.v[key]),r=b.regel;
  vak.innerHTML=`${b.missen.length?`<ul>${b.missen.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`:""}
    ${r.starters.length?`<div class="tiprij"><span>Begin zo:</span>${r.starters.map((s,i)=>`<button type="button" class="starter" data-starter="${i}">${esc(s)}</button>`).join("")}</div>`:""}
    <details><summary>Bekijk een voorbeeld</summary><p class="zwak">✗ ${esc(r.voorbeeld[0])}</p><p class="sterk">✓ ${esc(r.voorbeeld[1])}</p></details>`;
  vak.querySelectorAll('[data-starter]').forEach(btn=>btn.onclick=()=>{
    const el=document.getElementById('f_'+key),s=r.starters[+btn.dataset.starter];
    const nieuw=(el.value.trim()?el.value.replace(/\s*$/," "):"")+s;
    el.value=nieuw.slice(0,el.maxLength);el.dispatchEvent(new Event('input'));el.focus();
    const pos=el.value.indexOf("…");if(pos>=0)el.setSelectionRange(pos,pos+1);
  });
}
function werkTipBij(key,direct){
  const knop=document.querySelector(`[data-tipknop="${key}"]`);if(!knop)return;
  const run=()=>{
    const tekst=(st.v[key]||"").trim(),b=beoordeel(key,tekst),toon=!!tekst&&!b.ok;
    knop.hidden=!toon;
    const vak=document.querySelector(`[data-tipvak="${key}"]`);
    if(!toon){vak.hidden=true;knop.setAttribute('aria-expanded','false')}
    else if(!vak.hidden)vulTipVak(key);
  };
  clearTimeout(werkTipBij["t"+key]);
  if(direct)run();else werkTipBij["t"+key]=setTimeout(run,1100);
}
function koppelTips(){
  if(!KW_AAN())return;
  document.querySelectorAll('#kaart [data-tipknop]').forEach(knop=>{
    const key=knop.dataset.tipknop,el=document.getElementById('f_'+key),vak=document.querySelector(`[data-tipvak="${key}"]`);
    knop.onclick=()=>{const open=vak.hidden;if(open)vulTipVak(key);vak.hidden=!open;knop.setAttribute('aria-expanded',String(open))};
    el.addEventListener('input',()=>werkTipBij(key,false));
    el.addEventListener('blur',()=>werkTipBij(key,true));
    werkTipBij(key,true);
  });
}
function zwakkeVelden(stap){

  return keys.filter(k=>(st.v[k]||"").trim()&&!beoordeel(k,st.v[k]).ok);
}

function vsAnalyse(){
  const s=vsStaat(),N=VS[s.niveau];if(!N)return{klaar:false,mist:["Kies je niveau."]};
  const P=N.profielen.find(p=>p.code===s.profiel);

  const profielVakken=[...P.vast,...P.groepen.flatMap((g,i)=>sel(P.code+".p"+i))];
  const R=P.vrij.find(r=>r.id===(s.route[s.niveau+"."+P.code]||""));
  if(R)R.groepen.forEach((g,i)=>{if(!g.als||g.als.some(v=>profielVakken.includes(v)))groepen.push({gk:P.code+"."+R.id+".v"+i,deel:"vrij",g})});
  groepen.forEach(x=>{const n=sel(x.gk).length;if(n<x.g.n)mist.push(`${x.deel==="gemeen"?"Gemeenschappelijk deel":x.deel==="profiel"?"Profieldeel":"Vrij deel"}: kies nog ${x.g.n-n} vak${x.g.n-n>1?"ken":""}${x.g.label?" ("+x.g.label.charAt(0).toLowerCase()+x.g.label.slice(1)+")":""}.`)});

  const vrij=R?[...R.vast,...groepen.filter(x=>x.deel==="vrij").flatMap(x=>sel(x.gk))]:[];
  return{N,P,R,groepen,sel,mist,klaar:!mist.length,gemeen,profiel,vrij};
}

  return h;

/* ================= wanneer is een stap ingevuld ================= */
function ingevuld(stap){
  const heeft=k=>(st.v[k]||"").toString().trim().length>0;
  switch(stap.type){
    case"titel":return heeft("naam")&&heeft("klasnaam");
    case"velden":return stap.velden.every(([k])=>heeft(k));
    case"vakkeuze":return stap.velden.every(([k])=>(st.v[k]||[]).length>0);
    case"wiel":{const w=wielStatus();return w.nu===w.tot&&w.lat===w.tot}
    case"doel":return[1,2,3].every(n=>heeft(stap.id+"_"+n))&&steunKeys(stap.id+"_4").every(heeft);
    case"form":return formKeys(stap).every(heeft);
    case"voorsorteer":return vsAnalyse().klaar&&heeft("vs_waarom");
    case"vragen":return stap.vragen.every(([k])=>heeft(k))&&(!stap.steun||steunKeys(stap.steun).every(heeft));
    case"vakken":return vakNamen().every(v=>st.talent[sleutel(v)]&&st.passie[sleutel(v)]);
    case"profiel":return stap.vragen.every(([k])=>heeft(k));
    case"afsluiting":return true;
    default:return true;
  }
}

function tekenNav(){
  const S=stappen();
  $('#stappen').innerHTML=S.map((s,i)=>`<button data-i="${i}" class="${i===st.stap?"actief":""} ${s.type!=="klaar"&&s.type!=="afsluiting"&&ingevuld(s)?"klaar":""}"><span class="nr">${s.type!=="klaar"&&s.type!=="afsluiting"&&ingevuld(s)?"✓":i+1}</span><span class="lbl">${esc(s.kort)}</span></button>`).join("");
  document.querySelectorAll('#stappen button').forEach(b=>b.onclick=()=>gaNaar(+b.dataset.i));
  const tel=S.filter(s=>s.type!=="klaar"&&s.type!=="afsluiting"),k=tel.filter(ingevuld).length;
  $('#voortgang').style.width=Math.round(k/tel.length*100)+"%";
}

function wielMelding(w){return w.nu<w.tot?`Kleur eerst alle onderdelen in (${w.nu} van de ${w.tot}).`:`Leg nog bij ${w.tot-w.lat} ${w.tot-w.lat===1?"onderdeel":"onderdelen"} je lat: waar wil je naartoe groeien?`}
function gaNaar(i){
  const cur=stappen()[st.stap];
  if(cur&&cur.type==="wiel"&&i>st.stap&&!ingevuld(cur)){const w=wielStatus();toast(wielMelding(w));if(w.nu===w.tot&&modus!=="doel"){modus="doel";tekenStap()}return}
  st.stap=Math.max(0,Math.min(stappen().length-1,i));bewaar();tekenStap();window.scrollTo({top:0,behavior:"smooth"})}

/* ================= stappen tekenen ================= */
function tekenStap(){
  terugNaarWerk();
  const S=stappen();if(st.stap>=S.length)st.stap=0;
  const stap=S[st.stap],k=$('#kaart');
  let h=`<h2>${esc(stap.titel)}</h2>${stap.uitleg?`<p class="uitleg">${esc(stap.uitleg)}</p>`:""}`;
  if(stap.type==="klaar")h=`<img class="slogan" src="data:image/png;base64,${HUISSTIJL.sloganPaars.d}" alt="Het begint hier">`+h;
  if(stap.id==="toekomst"&&KW_AAN())h+=`<p class="uitleg">Weet je het nog niet precies? Dat is niet erg. Schrijf op wat je al wél weet.</p>`+hulpToekomstHtml();
  switch(stap.type){
    case"titel":
      h+=tekstVeld("naam","Wat is je naam?",0,40)+tekstVeld("klasnaam","In welke klas zit je?",0,20);
      if(leerjaar(cfg.versie)>1){zorgKlas();h+=`<div class="veld"><label for="f_soort">${soortVraag()}</label><select id="f_soort">${klasOpties().map(o=>`<option ${o===st.klas?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`}
      h+=`<div class="backupblok"><p><b>Heb je al eerder gewerkt aan je POP?</b> Je antwoorden worden automatisch bewaard in deze browser. Werk je op een andere laptop of in een andere browser, open dan je backup.</p>
        <div class="rij"><button class="sec" data-backup="openen">📂 Backup openen</button></div></div>`;
      break;
    case"velden":
      h+=stap.velden.map(([key,label,lang])=>tekstVeld(key,label,lang)).join("");break;
    case"vakkeuze":
      h+=stap.velden.map(([key,label])=>`<div class="veld"><label>${esc(label)}</label><div class="chips" data-chips="${key}">${vakNamen().map(v=>{const n=kaal(v),aan=(st.v[key]||[]).includes(n);return`<button data-vak="${esc(n)}" class="${aan?"aan":""}">${esc(n)}</button>`}).join("")}</div></div>
        ${tekstVeld(key+"_t","Toelichting (mag je leeg laten)",1,100)}`).join("");break;
    case"wiel":
      h+=`<p class="uitleg">Kleur eerst in waar je nu staat. Zet daarna per onderdeel een dikke lijn op de plek waar je naartoe wilt groeien.</p>
      <div class="balk"><div class="seg" id="modus"><button data-m="nu" class="${modus==="nu"?"actief":""}">1 · Waar sta ik nu?</button><button data-m="doel" class="${modus==="doel"?"actief":""}">2 · Waar wil ik naartoe?</button></div><div class="rechts">${diagramKnoppen("svgVaard")}</div></div>
      <p class="wielstatus" id="wielStatus"></p><div class="visbox" id="plek"></div><p class="hint" id="hint"></p>`;break;
    case"doel":{
      const lijst=stap.kant==="boven"?kernLijst():basisLijst(),vr=DOELVRAGEN(stap.soort),tip=doelTip(stap.kant);
      h+=(tip?`<div class="tip">💡 ${esc(tip)}</div>`:"")+
        `<div class="veld"><label for="f_${stap.id}_1">1. ${esc(vr[0])}</label><select id="f_${stap.id}_1" data-key="${stap.id}_1"><option value="">— kies —</option>${lijst.map(o=>`<option ${st.v[stap.id+"_1"]===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`+
        [2,3].map(n=>tekstVeld(stap.id+"_"+n,n+". "+vr[n-1],1,120)).join("")+steunBlok(stap.id+"_4",4,vr[3]);
      break;}
    case"form":{
      const tip=stap.id==="doel"?vakTip():stap.id==="aanpak"?vaardTip():"";
      if(stap.id==="aanpak"&&ant("d_vak"))h+=`<div class="doelrecap"><span>Mijn doel</span><b>${esc(ant("d_vak"))}</b>${ant("d_wat")?" · "+esc(ant("d_wat")):""}</div>`;
      if(tip)h+=`<div class="tip">💡 ${esc(tip)}</div>`;
      h+=stap.items.map(([key,label,x],i)=>typeof x==="string"?keuzeHtml(key,(i+1)+". "+label,x):tekstVeld(key,(i+1)+". "+label,1,x)).join("");
      if(stap.steun)h+=steunBlok(stap.steun,stap.items.length+1,stap.steunVraag);
      break;}
    case"voorsorteer":
      h+=`<div id="vsplek">${vsHtml()}</div>`+tekstVeld("vs_waarom","Waarom kies ik op dit moment voor dit profiel?",1,120)+
        `<details class="vsmatch" id="vsMatch"><summary>📊 Bekijk welk profiel past bij jouw vakken (talent en passie)</summary><div id="plek"></div></details>
        <div class="rij"><button class="sec" id="vsPrint">🖨 Formulier afdrukken of opslaan als PDF</button></div>`;
      break;
    case"vragen":
      h+=stap.vragen.map(([key,label],i)=>tekstVeld(key,(stap.genummerd?(i+1)+". ":"")+label,1,stap.steun?120:140)).join("");
      if(stap.steun)h+=steunBlok(stap.steun,stap.vragen.length+1,"Wie of wat helpt mij om dit doel te bereiken?");break;
    case"vakken":
      h+=`<p class="uitleg">Klik per vak in de blauwe helft hoe goed je erin bent, en in de oranje helft hoe leuk je het vindt. Bekijk daarna het kwadrant.</p>
      <div class="balk"><div class="seg" id="weergave"><button data-w="roos" class="${weergave==="roos"?"actief":""}">Invullen (roos)</button><button data-w="kwadrant" class="${weergave==="kwadrant"?"actief":""}">Kwadrant</button></div><div class="rechts">${diagramKnoppen("vak")}</div></div>
      <div class="visbox" id="plek"></div><p class="hint" id="hint"></p>`;break;
    case"profiel":
      zorgKlas();
      h+=`<div class="twee"><div><div class="balk"><label for="f_soort" style="font-weight:700">${soortKort()}</label><select id="f_soort" style="padding:7px 10px;border-radius:8px;border:1.5px solid var(--rand);font:inherit">${klasOpties().map(o=>`<option ${o===st.klas?"selected":""}>${esc(o)}</option>`).join("")}</select><div class="rechts">${diagramKnoppen("svgProfiel")}</div></div><div id="plek"></div></div>
        <div>${stap.vragen.map(([key,label])=>tekstVeld(key,label,1,140)).join("")}</div></div>`;break;
    case"afsluiting":
      h+=stap.vragen.map(([key,label])=>tekstVeld(key,label,1,160)).join("");break;
    case"klaar":{
      const open=S.filter(s=>s.type!=="klaar"&&s.type!=="afsluiting");
      h+=`<p class="uitleg">Download je presentatie. Daarna kun je hem in PowerPoint openen en een persoonlijk tintje geven, bijvoorbeeld met een foto.</p>
      <ul class="lijst">${open.map(s=>{const zw=zwakkeVelden(s).length,i=S.indexOf(s);return`<li>${ingevuld(s)?`<span class="ok">✓</span>`:`<span class="leeg">!</span>`} ${esc(s.kort)}${ingevuld(s)?(zw?` <span class="sterker">— ${zw===1?"één antwoord kan":zw+" antwoorden kunnen"} nog sterker · <a data-ganaar="${i}">bekijk</a></span>`:""):` <span class="sterker">— nog niet helemaal ingevuld · <a data-ganaar="${i}">bekijk</a></span>`}</li>`}).join("")}</ul>
      <div class="rij" style="align-items:center;gap:12px"><button class="geel groot" id="dlPptx">⬇ Download mijn PowerPoint</button>${cfg.versie==="klas3"?`<button class="sec" id="vsPrint2">🖨 Profielformulier afdrukken</button>`:""}</div>
      <div class="backupblok"><p><b>Wil je later nog iets veranderen?</b> Sla dan ook een backup op. Daarmee kun je altijd verder, ook op een andere laptop.</p>
        <div class="rij"><button class="sec" data-backup="opslaan">💾 Backup opslaan</button></div></div>`;
      break;}
  }
  const laatste=st.stap===S.length-1;
  h+=`<div class="nav"><button class="sec" id="vorige" ${st.stap===0?"hidden":""}>← Vorige</button><span></span>${laatste?"":`<button id="volgende">Volgende →</button>`}</div>`;
  k.innerHTML=h;
  koppelVelden();koppelKopieer();koppelTips();koppelHulpToekomst();
  document.querySelectorAll('#kaart [data-ganaar]').forEach(a=>a.onclick=()=>gaNaar(+a.dataset.ganaar));
  if($('#vorige'))$('#vorige').onclick=()=>gaNaar(st.stap-1);
  if($('#volgende'))$('#volgende').onclick=()=>gaNaar(st.stap+1);
  if($('#f_soort'))$('#f_soort').onchange=e=>{st.klas=e.target.value;bewaar();if(stap.type==="profiel"){renderProfiel()}};
  document.querySelectorAll('[data-chips]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const key=g.dataset.chips,l=st.v[key]||[],n=b.dataset.vak,max=+g.dataset.max||99;
    if(!l.includes(n)&&l.length>=max){toast(`Kies er maximaal ${max}. Klik eerst een andere uit.`);return}
    st.v[key]=l.includes(n)?l.filter(x=>x!==n):l.concat(n);bewaar();b.classList.toggle('aan');tekenNav();
  }));
  if(stap.type==="wiel"){
    plaats("svgVaard",$('#plek'));const hint=()=>{$('#hint').textContent=modus==="nu"?"Klik in elke taartpunt op het ringetje dat bij jouw score past. Nog eens klikken op je hoogste ring = één lager.":"Klik per taartpunt op de ring waar je naartoe wilt groeien. Daar komt een dikke lijn. Nog eens klikken haalt hem weg."};
    renderVaard();hint();werkWielStatus();
    document.querySelectorAll('#modus button').forEach(b=>b.onclick=()=>{modus=b.dataset.m;document.querySelectorAll('#modus button').forEach(x=>x.classList.toggle('actief',x===b));hint()});

    const toon=()=>{terugNaarWerk();plaats(weergave==="roos"?"svgRoos":"svgKwadrant",$('#plek'));(weergave==="roos"?renderRoos:renderKwadrant)();
      $('#hint').textContent=weergave==="roos"?"Nog eens klikken op je hoogste ring = één lager.":"Rechtsboven staan de vakken waar talent en passie samenkomen."};
    toon();document.querySelectorAll('#weergave button').forEach(b=>b.onclick=()=>{weergave=b.dataset.w;document.querySelectorAll('#weergave button').forEach(x=>x.classList.toggle('actief',x===b));toon()});

  if(stap.type==="voorsorteer"){
    const her=()=>{vsOpschonen();$('#vsplek').innerHTML=vsHtml();vsKoppel(her);tekenNav()};
    vsOpschonen();vsKoppel(her);$('#vsPrint').onclick=vsAfdrukken;
    $('#vsMatch').addEventListener('toggle',e=>{if(e.target.open){plaats("svgProfiel",$('#plek'));zorgKlas();renderProfiel()}});
  }
  if(stap.type==="klaar"){if($('#vsPrint2'))$('#vsPrint2').onclick=vsAfdrukken;$('#dlPptx').onclick=maakPptx}
  document.querySelectorAll('#kaart [data-backup]').forEach(b=>b.onclick=()=>b.dataset.backup==="opslaan"?backupOpslaan():$('#backupBestand').click());
  tekenNav();
}
function vakTip(){
  const l=vakNamen().map(v=>({v:kaal(v),t:st.talent[sleutel(v)]||0})).filter(x=>x.t).sort((a,b)=>a.t-b.t);
  return l.length?`Bij ‘Mijn vakken’ gaf je jezelf het laagst voor talent bij ${l.slice(0,2).map(x=>"“"+x.v+"”").join(" en ")}.`:"";
}
function vaardTip(){
  syncDalton();const L=[...kernLijst(),...basisLijst()],nu=[...st.dalton.boven,...st.dalton.onder],dl=[...st.dalton.dBoven,...st.dalton.dOnder];
  if(!nu.some(x=>x))return"";
  let best=0,bi=-1;nu.forEach((x,i)=>{const g=(dl[i]||0)-x;if(dl[i]&&g>best){best=g;bi=i}});
  if(bi>=0)return`In je IK-rapport is het verschil tussen nu en je doel het grootst bij “${L[bi]}”.`;
  return`In je IK-rapport scoor je jezelf het laagst bij “${L[nu.indexOf(Math.min(...nu))]}”.`;
}
const MAX_KEUZE=3;
function keuzeHtml(key,label,soort){
  let v=st.v[key]||[];if(!Array.isArray(v))v=st.v[key]=v?[v]:[];
  const chips=l=>`<div class="chips" data-chips="${key}" data-max="${MAX_KEUZE}">${l.map(o=>`<button type="button" data-vak="${esc(o)}" class="${v.includes(o)?"aan":""}">${esc(o)}</button>`).join("")}</div>`;
  const inhoud=soort==="vak"?chips(vakNamen().map(kaal)):
    `<p class="groep">Dalton kernwaarden</p>${chips(kernLijst())}<p class="groep">Basisvaardigheden</p>${chips(basisLijst())}`;
  return`<div class="veld"><label>${esc(label)} <span class="max">(kies er 1 tot ${MAX_KEUZE})</span></label>${inhoud}</div>`;
}
const formKeys=stap=>stap.items.map(i=>i[0]).concat(stap.steun?steunKeys(stap.steun):[]);
function doelTip(kant){
  syncDalton();
  const nu=st.dalton[kant],dl=st.dalton[kant==="boven"?"dBoven":"dOnder"],lijst=kant==="boven"?kernLijst():basisLijst();
  if(!nu.some(x=>x))return"";
  let best=-1,bi=-1;nu.forEach((x,i)=>{const gat=(dl[i]||0)-x;if(dl[i]&&gat>best){best=gat;bi=i}});
  if(bi>=0&&best>0)return`In je IK-rapport is het verschil tussen nu en je doel het grootst bij "${lijst[bi]}".`;
  const lo=nu.indexOf(Math.min(...nu));return`In je IK-rapport scoor je jezelf het laagst bij "${lijst[lo]}".`;
}

function werkWielStatus(){const el=$('#wielStatus');if(!el)return;const w=wielStatus(),klaar=w.nu===w.tot&&w.lat===w.tot;
  el.className="wielstatus"+(klaar?" ok":"");el.innerHTML=klaar?"✓ Klaar: alles ingekleurd en bij elk onderdeel je lat gelegd.":`Ingekleurd: <b>${w.nu}/${w.tot}</b> · Lat gelegd: <b>${w.lat}/${w.tot}</b>`}
document.getElementById('svgVaard').addEventListener('click',e=>{
  const c=e.target.closest('.cel');if(!c)return;
  const z=c.dataset.z,j=+c.dataset.j,k=+c.dataset.k;
  const dz=z==="boven"?"dBoven":"dOnder",max=cfg.dalton.max;
  if(modus==="nu"){
    const nieuw=st.dalton[z][j]===k+1?k:k+1;st.dalton[z][j]=nieuw;
    if(st.dalton[dz][j]&&st.dalton[dz][j]<=nieuw&&nieuw<max)st.dalton[dz][j]=0;
  }else{
    const nu=st.dalton[z][j];
    if(!nu){toast("Kleur dit onderdeel eerst in: waar sta je nu?");return}
    if(k+1<=nu&&!(nu===max&&k+1===max)){toast("Leg je lat hoger dan waar je nu staat.");return}
    st.dalton[dz][j]=st.dalton[dz][j]===k+1?0:k+1;
  }
  bewaar();renderVaard();tekenNav();werkWielStatus();
  const w=wielStatus();
  if(modus==="nu"&&w.nu===w.tot&&w.lat<w.tot&&!werkWielStatus.gemeld){werkWielStatus.gemeld=1;modus="doel";
    document.querySelectorAll('#modus button').forEach(x=>x.classList.toggle('actief',x.dataset.m==="doel"));
    $('#hint').textContent="Klik per taartpunt op de ring waar je naartoe wilt groeien. Daar komt een dikke lijn. Nog eens klikken haalt hem weg.";
    toast("Mooi! Leg nu per onderdeel je lat: waar wil je naartoe groeien?")}
});
document.getElementById('svgRoos').addEventListener('click',e=>{

async function maakPNG(svgEl,schaal=2){
  const vb=svgEl.viewBox.baseVal,w=vb.width,h=vb.height;
  const kl=svgEl.cloneNode(true);kl.removeAttribute('hidden');kl.setAttribute('width',w*schaal);kl.setAttribute('height',h*schaal);
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(kl))});
  const cv=document.createElement('canvas');cv.width=w*schaal;cv.height=h*schaal;const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);
  return new Promise(r=>cv.toBlob(r,'image/png'));
}
const blobNaarData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function plaatje(id){
  const blob=await maakPNG(document.getElementById(id));
  const img=await createImageBitmap(blob),cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
  const ctx=cv.getContext('2d');ctx.drawImage(img,0,0);const d=ctx.getImageData(0,0,cv.width,cv.height).data;
  let x0=cv.width,y0=cv.height,x1=0,y1=0;
  for(let y=0;y<cv.height;y+=2)for(let x=0;x<cv.width;x+=2){const i=(y*cv.width+x)*4;if(d[i]<245||d[i+1]<245||d[i+2]<245){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<=x0||y1<=y0)return{data:(await blobNaarData(blob)).replace(/^data:/,""),ratio:img.width/img.height};
  const pad=24;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(cv.width,x1+pad);y1=Math.min(cv.height,y1+pad);
  const uit=document.createElement('canvas');uit.width=x1-x0;uit.height=y1-y0;const u=uit.getContext('2d');
  u.fillStyle='#fff';u.fillRect(0,0,uit.width,uit.height);u.drawImage(cv,x0,y0,uit.width,uit.height,0,0,uit.width,uit.height);
  const b2=await new Promise(r=>uit.toBlob(r,'image/png'));
  return{data:(await blobNaarData(b2)).replace(/^data:/,""),ratio:uit.width/uit.height};
}
function pasIn(p,bw,bh){let w=bw,h=w/p.ratio;if(h>bh){h=bh;w=h*p.ratio}return{w,h}}

}

const merkImg=k=>"image/png;base64,"+HUISSTIJL[k].d;
function logoRechtsonder(s,wit){const w=1.9,h=w/HUISSTIJL.logoPaars.r;s.addImage({data:merkImg(wit?"logoWit":"logoPaars"),x:SW-0.45-w,y:7.5-0.35-h,w,h})}
function logoLinksonder(s){const w=1.9,h=w/HUISSTIJL.logoPaars.r;s.addImage({data:merkImg("logoPaars"),x:0.92,y:7.5-0.35-h,w,h})}
function sterAchtergrond(s,{kleur="paars",x,y,size,transparency=0}){s.addImage({data:kleur==="wit"?MERK.sterWit:kleur==="geel"?MERK.sterGeel:MERK.sterPaars,x,y,w:size,h:size,transparency})}
function inhoudDia(pres,titel,{ster=true}={}){
  const s=pres.addSlide();s.background={color:"FFFFFF"};
  if(ster)sterAchtergrond(s,{kleur:"geel",x:SW-2.6,y:-1.35,size:3.9,transparency:55});
  logoRechtsonder(s);
  s.addText(titel,{x:0.92,y:0.38,w:11.5,h:1.38,fontFace:HF,fontSize:titelGrootte(titel),bold:true,color:HP,valign:"middle",margin:0,isTextBox:true});
  return s;
}
function zijTitel(s,regels,x,y,w){
  s.addText(regels.map((r,i)=>({text:r,options:{breakLine:i<regels.length-1}})),{x,y,w,h:1.9,fontFace:HF,fontSize:48,bold:true,color:HP,valign:"top",margin:0,isTextBox:true,lineSpacingMultiple:0.95});
}
const ant=k=>{const x=st.v[k];return Array.isArray(x)?x.join(", "):(x||"").toString().trim()};
function pasGrootte(alineas,w,h){
  for(const g of [20,18,16]){const cpl=w*72/(g*0.52),lh=g*1.2/72;
    const hoogte=alineas.reduce((s,[txt,gap])=>s+Math.max(1,Math.ceil(txt.length/cpl))*lh+(gap?g*0.9/72:0),0);
    if(hoogte<=h)return g}
  return 16}
const steunParen=p=>STEUN.map(([s,,l])=>[l,ant(p+s)]);
function vraagRuns(paren,{nummer=false,w=11.5,h=4.85}={}){
  const alineas=paren.flatMap(([q,a,subs])=>subs?[[q,0],...subs.map(([l,x],k)=>[l+": "+(x||""),k===subs.length-1])]:[[q,0],[a||" ",1]]);
  const grootte=pasGrootte(alineas,w,h);
  const runs=[];
  paren.forEach(([vraag,antwoord,subs],i)=>{
    const laatste=i===paren.length-1;
    runs.push({text:(nummer?(i+1)+". ":"")+vraag,options:{breakLine:true,fontSize:grootte,color:"000000"}});
    if(subs){subs.forEach(([l,a],k)=>{const end=k===subs.length-1;
      runs.push({text:l+": ",options:{fontSize:grootte,color:"000000",indentLevel:1}});
      runs.push({text:a||" ",options:{fontSize:grootte,color:HP,bold:!!a,breakLine:!(laatste&&end),paraSpaceAfter:end?grootte*0.9:2}});});}
    else runs.push({text:antwoord||" ",options:{breakLine:!laatste,fontSize:grootte,color:HP,bold:!!antwoord,paraSpaceAfter:grootte*0.9}});
  });
  return runs;
}
function tekstvak(s,runs,opt){s.addText(runs,Object.assign({x:0.92,y:1.95,w:11.5,h:4.85,fontFace:HF,valign:"top",margin:0,isTextBox:true,paraSpaceAfter:2},opt||{}))}
function bestandsnaamPptx(){return("POP "+[ant("naam"),ant("klasnaam")].filter(Boolean).join(" ")).replace(/[\\/:*?"<>|]+/g,"").trim()+".pptx"}
async function maakPptx(){
  const knop=$('#dlPptx');if(knop){knop.disabled=true;knop.textContent="Bezig met maken…"}
  try{
    const pres=await bouwPptx();
    await pres.writeFile({fileName:bestandsnaamPptx()});
    toast("Je PowerPoint is gedownload. Open hem en maak hem helemaal van jou!");
  }catch(e){console.error(e);toast("Er ging iets mis bij het maken van de PowerPoint.")}
  finally{if(knop){knop.disabled=false;knop.textContent="⬇ Download mijn PowerPoint"}}
}
async function bouwPptx(){
  {
    renderVaard();renderRoos();renderKwadrant();zorgKlas();renderProfiel();
    await laadMerk();
    const pres=new PptxGenJS();pres.layout="LAYOUT_WIDE";
    const naam=ant("naam"),klas=ant("klasnaam");
    pres.title="POP van "+(naam||"…");pres.author=naam||"Leerling";
    for(const stap of stappen()){
      switch(stap.type){
        case"titel":{
          const s=pres.addSlide();s.background={color:HG};
          sterAchtergrond(s,{kleur:"wit",x:7.9,y:-1.9,size:7.4});
          s.addText([{text:"POP van",options:{breakLine:true}},{text:naam||"......"}],{x:0.92,y:2.2,w:7.4,h:2.3,fontFace:HF,fontSize:54,bold:true,color:"FFFFFF",align:"left",valign:"bottom",margin:0,isTextBox:true});
          s.addText([{text:"Klas: "+klas,options:{breakLine:true}},{text:"Schooljaar: "+schooljaar()}],{x:0.92,y:4.7,w:7.4,h:1.1,fontFace:HF,fontSize:20,color:HP,align:"left",valign:"top",margin:0,isTextBox:true});
          logoRechtsonder(s);
          break;}
        case"velden":{
          const s=inhoudDia(pres,stap.titel),runs=[];
          stap.velden.forEach(([k,label,lang],i)=>{
            if(lang&&i)runs.push({text:" ",options:{breakLine:true,fontSize:12}});
            runs.push({text:label+": ",options:{fontSize:20,color:"000000",breakLine:!!lang}});
            runs.push({text:ant(k)||" ",options:{fontSize:20,color:HP,bold:true,breakLine:i<stap.velden.length-1}});
          });
          tekstvak(s,runs);break;}
        case"vakkeuze":{
          const s=inhoudDia(pres,stap.titel);
          tekstvak(s,vraagRuns(stap.velden.map(([k,label])=>[label,[(st.v[k]||[]).join(", "),ant(k+"_t")].filter(Boolean).join(". ")])));break;}
        case"wiel":{
          const s=pres.addSlide();s.background={color:"FFFFFF"};zijTitel(s,["Mijn","IK-rapport"],0.6,0.55,3.6);
          const p=await plaatje("svgVaard"),{w,h}=pasIn(p,8.3,6.95),bx=4.45;
          s.addImage({data:p.data,x:bx+(8.3-w)/2,y:0.28+(6.95-h)/2,w,h});logoRechtsonder(s);break;}
        case"doel":{
          const s=inhoudDia(pres,stap.titel),vr=DOELVRAGEN(stap.soort);
          tekstvak(s,vraagRuns(vr.map((q,i)=>i<3?[q,ant(stap.id+"_"+(i+1))]:[q,"",steunParen(stap.id+"_4")]),{nummer:true}));break;}
        case"voorsorteer":{
          const s=inhoudDia(pres,stap.titel),z=vsSamenvatting();
          if(!z){tekstvak(s,[{text:"Nog geen profiel gekozen.",options:{fontSize:20,color:HP}}]);break}
          s.addText([{text:"Voorsorteerprofiel "+z.niveau.toLowerCase()+": ",options:{color:"000000",bold:false}},{text:z.profiel,options:{color:HP,bold:true}}],{x:0.92,y:1.75,w:11.5,h:0.6,fontFace:HF,fontSize:26,margin:0,valign:"middle",isTextBox:true});
          const kol=[["Gemeenschappelijk deel",z.gemeen,""],["Profieldeel",z.profielvakken,""],["Vrij deel",z.vrij,z.route]],cw=(11.5-0.6)/3;
          kol.forEach(([kop,vakken,sub],i)=>{const x=0.92+i*(cw+0.3);
            s.addShape(pres.shapes.ROUNDED_RECTANGLE,{x,y:2.6,w:cw,h:3.1,fill:{color:"F5EAF2"},line:{color:"F5EAF2"},rectRadius:0.12});
            const runs=[{text:kop,options:{bold:true,color:HP,fontSize:18,breakLine:true}}];
            if(sub)runs.push({text:sub,options:{italic:true,color:"6E5C69",fontSize:14,breakLine:true}});
            runs.push({text:" ",options:{fontSize:6,breakLine:true}});
            (vakken.length?vakken:["–"]).forEach((v,k,arr)=>runs.push({text:v,options:{color:"000000",fontSize:vakken.length>5?15:17,breakLine:k<arr.length-1}}));
            s.addText(runs,{x:x+0.2,y:2.75,w:cw-0.4,h:2.85,fontFace:HF,valign:"top",margin:0,isTextBox:true});
          });
          if(ant("vs_waarom"))s.addText([{text:"Waarom: ",options:{color:"000000"}},{text:ant("vs_waarom"),options:{color:HP,bold:true}}],{x:0.92,y:5.95,w:11.5,h:0.95,fontFace:HF,fontSize:18,valign:"top",margin:0,isTextBox:true});
          break;}
        case"form":{
          const s=inhoudDia(pres,stap.titel);
          const paren=stap.items.map(([k,q])=>[q,ant(k)]);if(stap.steun)paren.push([stap.steunVraag,"",steunParen(stap.steun)]);
          tekstvak(s,vraagRuns(paren,{nummer:true}));break;}
        case"vragen":{
          const s=inhoudDia(pres,stap.titel);
          const paren=stap.vragen.map(([k,q])=>[q,ant(k)]);if(stap.steun)paren.push(["Wie of wat helpt mij om dit doel te bereiken?","",steunParen(stap.steun)]);
          tekstvak(s,vraagRuns(paren,{nummer:!!stap.genummerd}));break;}
        case"vakken":{
          const s=pres.addSlide();s.background={color:"FFFFFF"};
          s.addText(stap.titel,{x:0.6,y:0.3,w:12.1,h:0.85,fontFace:HF,fontSize:40,bold:true,color:HP,valign:"middle",margin:0,isTextBox:true});
          const a=await plaatje("svgRoos"),b=await plaatje("svgKwadrant"),gap=0.35,bh=5.6;
          let h=Math.min(bh,(12.3-gap)/(a.ratio+b.ratio));const wa=h*a.ratio,wb=h*b.ratio,x0=(SW-(wa+wb+gap))/2,y=1.25+(bh-h)/2;
          s.addImage({data:a.data,x:x0,y,w:wa,h});s.addImage({data:b.data,x:x0+wa+gap,y,w:wb,h});logoRechtsonder(s);break;}
        case"profiel":{
          const s=pres.addSlide();s.background={color:"FFFFFF"};
          const p=await plaatje("svgProfiel"),{w,h}=pasIn(p,7.2,6.95);
          s.addImage({data:p.data,x:0.45,y:0.28+(6.95-h)/2,w,h});
          const rx=0.45+w+0.45,rw=SW-rx-0.5;
          zijTitel(s,["Welk profiel","past bij mij?"],rx,0.55,rw);
          tekstvak(s,vraagRuns(stap.vragen.map(([k,q])=>[q,ant(k)]),{w:rw,h:4.25}),{x:rx,w:rw,y:2.45,h:4.25});logoRechtsonder(s);break;}
        case"afsluiting":{
          const s=pres.addSlide();s.background={color:HG};
          s.addText(stap.titel,{x:0.92,y:0.38,w:11.5,h:1.38,fontFace:HF,fontSize:60,bold:true,color:"FFFFFF",valign:"middle",margin:0,isTextBox:true});
          const runs=[];stap.vragen.forEach(([k,q],i)=>{
            runs.push({text:q,options:{bullet:true,bold:true,fontSize:24,color:HP,breakLine:true}});
            runs.push({text:ant(k)||" ",options:{fontSize:20,color:HP,indentLevel:1,breakLine:i<stap.vragen.length-1,paraSpaceAfter:22}});
          });
          tekstvak(s,runs,{w:7.9,h:4.6});
          {const w=4.1,h=w/HUISSTIJL.sloganWit.r;s.addImage({data:merkImg("sloganWit"),x:SW-0.7-w,y:7.5-0.55-h,w,h})}
          logoLinksonder(s);break;}
      }
    }
    return pres;
  }
}



/* ================= backup ================= */
const BACKUP_SOORT="pop-gesprek-backup";
function backupOpslaan(){
  const data={soort:BACKUP_SOORT,formaat:1,versie:cfg.versie,opgeslagen:new Date().toISOString(),antwoorden:st};
  const naam=("POP backup "+[ant("naam"),ant("klasnaam")].filter(Boolean).join(" ")).replace(/[\\/:*?"<>|]+/g,"").trim()+".pop";
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));
  a.download=naam;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast("Backup opgeslagen als “"+naam+"”. Bewaar dit bestand goed, bijvoorbeeld in je OneDrive.");
}
function heeftAntwoorden(){return Object.values(st.v||{}).some(x=>Array.isArray(x)?x.length:String(x).trim())||Object.keys(st.talent||{}).length||(st.dalton.boven||[]).some(x=>x)}
async function backupInlezen(bestand){
  let data;
  try{data=JSON.parse(await bestand.text())}catch(e){toast("Dit bestand is geen POP-backup.");return}
  if(!data||data.soort!==BACKUP_SOORT||!data.antwoorden||!data.antwoorden.dalton){toast("Dit bestand is geen POP-backup.");return}
  if(data.versie!==cfg.versie){toast(`Deze backup hoort bij ${versieNaam(data.versie)}. Open de juiste versie en probeer het daar.`);return}
  if(heeftAntwoorden()&&!confirm("Je huidige antwoorden in deze browser worden vervangen door de backup. Doorgaan?"))return;
  const a=data.antwoorden;
  st={dalton:{boven:[],onder:[],dBoven:[],dOnder:[]},talent:{},passie:{},klas:"",v:{},stap:0};
  st.dalton=Object.assign(st.dalton,a.dalton);st.talent=a.talent||{};st.passie=a.passie||{};st.klas=a.klas||"";st.v=a.v||{};
  st.stap=Number.isInteger(a.stap)?a.stap:0;migreerSteun();
  bewaar();tekenStap();
  const d=data.opgeslagen?new Date(data.opgeslagen).toLocaleDateString("nl-NL",{day:"numeric",month:"long"}):"";
  toast("Backup geopend"+(d?" (opgeslagen op "+d+")":"")+". Je kunt verder waar je gebleven was!");
}
$('#backupOpslaan').onclick=backupOpslaan;
$('#backupOpenen').onclick=()=>$('#backupBestand').click();
$('#backupBestand').onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)backupInlezen(f)};
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f&&/\.(pop|json)$/i.test(f.name)){e.preventDefault();backupInlezen(f)}});


$('#versieLabel').textContent=versieNaam(cfg.versie);document.title="Mijn POP-gesprek – "+versieNaam(cfg.versie);
migreerSteun();bewaar();
tekenStap();
</script>
